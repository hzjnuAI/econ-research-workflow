name: Temporary Guangdong CCB Extract

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tmp/ccb_guangdong_extract.py'
      - '.github/workflows/tmp-ccb-guangdong-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Extract all Guangdong CCB business outlets
        run: python tmp/ccb_guangdong_extract.py

      - name: Upload complete raw data
        uses: actions/upload-artifact@v4
        with:
          name: ccb-guangdong-complete-20260806
          path: |
            ccb_output/ccb_guangdong_branches_raw.csv
            ccb_output/summary.json
          if-no-files-found: error
          retention-days: 1
