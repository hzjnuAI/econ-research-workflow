name: Temporary Guangdong CCB Extract

on:
  push:
    branches:
      - main
    paths:
      - 'tmp/ccb_guangdong_extract.py'
      - '.github/workflows/tmp-ccb-guangdong-extract.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Extract all Guangdong CCB business outlets
        run: python tmp/ccb_guangdong_extract.py

      - name: Commit extraction output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ccb_output/ccb_guangdong_branches_raw.csv ccb_output/summary.json
          git commit -m "chore: temporary Guangdong CCB extraction output" || exit 0
          git push origin HEAD:main
